name: FargoRate SMS

on:
  schedule:
    # GitHub cron is UTC only. MST = UTC-7 (not adjusted for DST).
    - cron: '0 15 * * 2'   # 8:00 AM MST, every Tuesday (Tuesday league)
    - cron: '0 19 * * 6'   # 12:00 PM MST every Saturday (Sunday league)
  workflow_dispatch:        # lets you trigger it manually to test
    inputs:
      division:
        description: 'Division to text'
        type: choice
        options:
          - tuesday
          - sunday
        default: tuesday

jobs:
  send-sms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run FargoRate SMS script
        env:
          # Scheduled runs: Sunday-league cron fires at 19:00 UTC, otherwise Tuesday.
          DIVISION: ${{ github.event.inputs.division || (github.event.schedule == '0 19 * * 6' && 'sunday' || 'tuesday') }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
        run: python fargorate_sms.py
